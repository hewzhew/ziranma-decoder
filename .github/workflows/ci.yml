name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Activate pinned Rust
        run: |
          rustc --version --verbose
          cargo --version
          cargo clippy --version

      - name: Check formatting
        run: cargo fmt --check

      # The decoder, public package tooling, and capsule replay stay portable.
      # TSF registration and the current-user GUI/DPAPI tools are deliberately
      # Windows-only and receive their exhaustive target check below.
      - name: Run Clippy (portable targets)
        if: runner.os != 'Windows'
        run: >-
          cargo clippy --locked --lib
          --bin ziranma-decoder
          --bin candidatectl
          --bin capsule-replay
          --test decoder
          --all-features -- -D warnings

      - name: Run Clippy (all Windows targets)
        if: runner.os == 'Windows'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests (portable targets)
        if: runner.os != 'Windows'
        run: >-
          cargo test --locked --lib
          --bin ziranma-decoder
          --bin candidatectl
          --bin capsule-replay
          --test decoder

      - name: Run tests (all Windows targets)
        if: runner.os == 'Windows'
        run: cargo test --locked

      - name: Run release audit
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release-audit.ps1 -RequireClean
