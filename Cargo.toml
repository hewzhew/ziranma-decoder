[package]
name = "ziranma-decoder"
version = "0.1.0"
edition = "2024"
description = "A privacy-first, explainable noisy-channel decoder experiment for Ziranma double pinyin"
license = "MPL-2.0"
repository = "https://github.com/hewzhew/ziranma-decoder"
publish = false
default-run = "ziranma-decoder"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
